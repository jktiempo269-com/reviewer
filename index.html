<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reviewer</title>
<style>
  :root {
    --bg: #FAFAF8;
    --ink: #1C1C1A;
    --muted: #6B6B65;
    --accent: rgb(13, 110, 253);
    --line: #E4E2DC;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  html, body {
    height: 100%;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .card {
    width: 100%;
    max-width: 380px;
    text-align: center;
  }

  h1 {
    font-size: 2.25rem;
    font-weight: 600;
    letter-spacing: -0.02em;
    margin-bottom: 8px;
  }

  p.subtitle {
    color: var(--muted);
    font-size: 0.95rem;
    margin-bottom: 40px;
  }

  .actions {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  button {
    font-family: inherit;
    font-size: 1rem;
    font-weight: 500;
    padding: 14px 20px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: #fff;
    color: var(--ink);
    cursor: pointer;
    transition: border-color 0.15s ease, background 0.15s ease, transform 0.05s ease;
  }

  button:hover {
    border-color: var(--accent);
  }

  button:active {
    transform: scale(0.98);
  }

  button:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .primary {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }

  .primary:hover {
    background: rgb(13, 110, 253);
    border-color: rgb(13, 110, 253);
  }
</style>
</head>
<body>

  <div class="card">
    <h1>Reviewer</h1>
    <p class="subtitle">Study your way, then put it to the test.</p>

    <div class="actions">
      <button class="primary" type="button" onclick="location.href='flashcards.html'">Flashcards</button>
      <button type="button" onclick="location.href='test.html'">Reviewer Test</button>
    </div>
  </div>

</body>
</html>
