<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reviewer</title>
<script>
  (function () {
    var saved = localStorage.getItem('theme');
    var theme = saved || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    document.documentElement.setAttribute('data-theme', theme);
  })();
</script>
<style>
  :root {
    --bg: #FAFAF8;
    --ink: #1C1C1A;
    --muted: #6B6B65;
    --accent: rgb(13, 110, 253);
    --line: #E4E2DC;
    --card-bg: #fff;
  }

  html[data-theme="dark"] {
    --bg: #161614;
    --ink: #F0F0EC;
    --muted: #9C9C94;
    --accent: rgb(70, 145, 255);
    --line: #34342F;
    --card-bg: #201F1B;
  }

  html {
    background: var(--bg);
    transition: background 0.15s ease;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  html, body {
    height: 100%;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .card {
    width: 100%;
    max-width: 380px;
    text-align: center;
  }

  h1 {
    font-size: 2.25rem;
    font-weight: 600;
    letter-spacing: -0.02em;
    margin-bottom: 8px;
  }

  p.subtitle {
    color: var(--muted);
    font-size: 0.95rem;
    margin-bottom: 40px;
  }

  .actions {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  button {
    font-family: inherit;
    font-size: 1rem;
    font-weight: 500;
    padding: 14px 20px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: var(--card-bg);
    color: var(--ink);
    cursor: pointer;
    transition: border-color 0.15s ease, background 0.15s ease, transform 0.05s ease;
  }

  .theme-toggle {
    position: fixed;
    top: 1rem;
    right: 1rem;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    padding: 0;
    font-size: 1.1rem;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  button:hover {
    border-color: var(--accent);
  }

  button:active {
    transform: scale(0.98);
  }

  button:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .primary {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }

  .primary:hover {
    background: rgb(13, 110, 253);
    border-color: rgb(13, 110, 253);
  }

  /* --- Page loader --- */
  .page-loader-overlay {
    position: fixed;
    inset: 0;
    background: var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 2000;
    transition: opacity 0.25s ease;
  }

  .page-loader-overlay.hidden {
    opacity: 0;
    pointer-events: none;
  }

  .loader {
    display: inline-block;
    position: relative;
    width: 80px;
    height: 80px;
  }
  .loader div {
    position: absolute;
    top: 33px;
    width: 13px;
    height: 13px;
    border-radius: 50%;
    background: #1e17f0;
    animation-timing-function: cubic-bezier(0, 1, 1, 0);
  }
  .loader div:nth-child(1) {
    left: 8px;
    animation: flip1 0.6s infinite;
  }
  .loader div:nth-child(2) {
    left: 8px;
    animation: flip2 0.6s infinite;
  }
  .loader div:nth-child(3) {
    left: 32px;
    animation: flip2 0.6s infinite;
  }
  .loader div:nth-child(4) {
    left: 56px;
    animation: flip3 0.6s infinite;
  }
  @keyframes flip1 {
    0% {
      transform: scale(0);
    }
    100% {
      transform: scale(1);
    }
  }
  @keyframes flip3 {
    0% {
      transform: scale(1);
    }
    100% {
      transform: scale(0);
    }
  }
  @keyframes flip2 {
    0% {
      transform: translate(0, 0);
    }
    100% {
      transform: translate(24px, 0);
    }
  }
</style>
</head>
<body>

  <div class="page-loader-overlay" id="pageLoader">
    <div class="loader">
      <div></div>
      <div></div>
      <div></div>
      <div></div>
    </div>
  </div>

  <button type="button" class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode"></button>

  <div class="card">
    <h1>Reviewer</h1>
    <p class="subtitle">Time to study. Para License. You Got this.</p>

    <div class="actions">
      <button class="primary" type="button" onclick="navigateTo('flashcards.html')">Flashcards</button>
      <button type="button" onclick="navigateTo('test.html')">Reviewer Test</button>
    </div>
  </div>

  <script>
    (function () {
      var btn = document.getElementById('themeToggle');
      function sync() {
        var isDark = document.documentElement.getAttribute('data-theme') === 'dark';
        btn.textContent = isDark ? '☀️' : '🌙';
      }
      sync();
      btn.addEventListener('click', function () {
        var isDark = document.documentElement.getAttribute('data-theme') === 'dark';
        var next = isDark ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        localStorage.setItem('theme', next);
        sync();
      });
    })();
  </script>

  <script>
    (function () {
      var loader = document.getElementById('pageLoader');
      window.addEventListener('load', function () {
        setTimeout(function () {
          loader.classList.add('hidden');
        }, 250);
      });
      window.addEventListener('pageshow', function (e) {
        // Restores instantly (no lingering loader) when coming back via bfcache
        if (e.persisted) {
          loader.classList.add('hidden');
        }
      });
    })();

    function navigateTo(url) {
      var loader = document.getElementById('pageLoader');
      loader.classList.remove('hidden');
      setTimeout(function () {
        window.location.href = url;
      }, 300);
    }
  </script>

</body>
</html>
