<html lang="en">
<head>
<meta charset="UTF-8">

<title>LTO 100-Item Reviewer</title>

<style>
  body {
    background-color: #f8f9fa;
  }

  .scene {
    width: 500px;
    max-width: 90vw;
    min-height: 420px;
    perspective: 1500px;
  }

  .flashcard {
    position: relative;
    width: 100%;
    min-height: 420px;
    transition: transform 0.6s;
    transform-style: preserve-3d;
    cursor: pointer;
  }

  .flashcard.flipped {
    transform: rotateY(180deg);
  }

  .card-face {
    position: absolute;
    inset: 0;
    backface-visibility: hidden;
    border-radius: 1rem;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 2rem;
    overflow-y: auto;
  }

  .card-front {
    background-color: #ffffff;
  }

  .card-back {
    background-color: #198754;
    color: #fff;
    transform: rotateY(180deg);
  }

  .sign-icon-wrap {
    text-align: center;
    margin-bottom: 0.75rem;
  }

  .sign-icon-wrap svg {
    width: 70px;
    height: 70px;
  }

  .options-list {
    text-align: left;
    list-style: none;
    padding-left: 0;
    margin-top: 1rem;
  }

  .options-list li {
    padding: 0.4rem 0.75rem;
    border-radius: 0.5rem;
    margin-bottom: 0.4rem;
    background-color: #f1f3f5;
  }

  .correct-answer {
    background-color: rgba(255, 255, 255, 0.2) !important;
    border: 2px solid #fff;
    border-radius: 0.75rem;
    padding: 0.75rem 1rem;
    margin-top: 0.5rem;
    font-weight: 600;
  }

  .hint-text {
    font-size: 0.85rem;
    opacity: 0.7;
  }

  /* --- Mobile responsiveness --- */
  @media (max-width: 576px) {
    body {
      padding: 0.5rem;
    }

    .container {
      padding-top: 8rem;
      padding-left: 0.5rem;
      padding-right: 0.5rem;
    }

    .scene {
      width: 100%;
      min-height: 380px;
    }

    .flashcard {
     min-height: auto;
    }

    .card-face {
      height: fit-content;
      padding: 1.25rem;
    }
    .card-back{
        height: 30rem;
    }
   
    .d-flex.gap-3.mt-4{
       position: absolute;
       bottom: 90px;
    }
    .d-flex.gap-2.mt-3{
        position: absolute;
        bottom: 50px;
    }

    .sign-icon-wrap svg {
      width: 56px;
      height: 56px;
    }

    #progress {
      font-size: 0.85rem;
    }

    #questionText {
      font-size: 1rem;
    }

    .options-list li {
      font-size: 0.9rem;
      padding: 0.35rem 0.6rem;
    }

    #answerText {
      font-size: 1rem;
    }

    .correct-answer {
      font-size: 0.95rem;
      padding: 0.6rem 0.8rem;
    }

    .hint-text {
      font-size: 0.75rem;
    }

    .d-flex.gap-3.mt-4 {
      width: 100%;
      gap: 0.5rem !important;
    }

    .d-flex.gap-3.mt-4 .btn {
      flex: 1 1 0;
      font-size: 0.9rem;
      padding: 0.5rem 0.5rem;
      white-space: nowrap;
    }

    .d-flex.gap-2.mt-3 {
      width: 100%;
      justify-content: center;
      flex-wrap: wrap;
    }

    #jumpInput {
      width: 70px !important;
    }
  }

  @media (max-width: 360px) {
    .scene, .flashcard {
      min-height: 420px;
    }

    .card-face {
      padding: 1rem;
    }

    #questionText {
      font-size: 0.9rem;
    }

    .options-list li {
      font-size: 0.85rem;
    }
  }
</style>
</head>

</div>

<script>
  // --- Sign icon renderer: draws simple representative sign shapes with SVG ---
  function polygonPoints(cx, cy, r, sides, rotation) {
    const pts = [];
    for (let i = 0; i < sides; i++) {
      const angle = rotation + (i * 2 * Math.PI) / sides;
      pts.push(`${(cx + r * Math.cos(angle)).toFixed(1)},${(cy + r * Math.sin(angle)).toFixed(1)}`);
    }
    return pts.join(" ");
  }

  function shapeMarkup(spec) {
    const cx = 30, cy = 30, r = 26;
    switch (spec.shape) {
      case "circle":
        return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${spec.fill}" stroke="${spec.stroke}" stroke-width="5"/>`;
      case "octagon":
        return `<polygon points="${polygonPoints(cx, cy, r, 8, Math.PI / 8)}" fill="${spec.fill}" stroke="${spec.stroke}" stroke-width="4"/>`;
      case "triangleUp":
        return `<polygon points="${polygonPoints(cx, cy, r, 3, -Math.PI / 2)}" fill="${spec.fill}" stroke="${spec.stroke}" stroke-width="5" stroke-linejoin="round"/>`;
      case "triangleDown":
        return `<polygon points="${polygonPoints(cx, cy, r, 3, Math.PI / 2)}" fill="${spec.fill}" stroke="${spec.stroke}" stroke-width="5" stroke-linejoin="round"/>`;
      case "diamond":
        return `<polygon points="${polygonPoints(cx, cy, r, 4, Math.PI / 4)}" fill="${spec.fill}" stroke="${spec.stroke}" stroke-width="4" stroke-linejoin="round"/>`;
      case "pentagon":
        return `<polygon points="${polygonPoints(cx, cy, r, 5, -Math.PI / 2)}" fill="${spec.fill}" stroke="${spec.stroke}" stroke-width="4" stroke-linejoin="round"/>`;
      case "rect":
        return `<rect x="5" y="12" width="50" height="36" rx="4" fill="${spec.fill}" stroke="${spec.stroke}" stroke-width="4"/>`;
      case "pavement":
        return `<rect x="2" y="2" width="56" height="56" fill="#6c757d"/>`;
      default:
        return "";
    }
  }

  function innerMarkup(spec) {
    const cx = 30, cy = 30;
    const s = spec.symbol || {};
    switch (s.kind) {
      case "text":
        return `<text x="${cx}" y="${cy + 5}" text-anchor="middle" font-size="${s.size || 14}" font-weight="700" fill="${s.color || '#000'}">${s.value}</text>`;
      case "diagonalBar":
        return `<line x1="10" y1="10" x2="50" y2="50" stroke="${s.color || '#dc3545'}" stroke-width="5"/>`;
      case "horizontalBar":
        return `<rect x="10" y="26" width="40" height="8" fill="${s.color || '#fff'}"/>`;
      case "arrowUp":
        return `<polygon points="30,12 40,30 33,30 33,48 27,48 27,30 20,30" fill="${s.color || '#fff'}"/>`;
      case "pavementLine":
        if (s.style === "solidYellow") return `<rect x="27" y="4" width="6" height="52" fill="#ffc107"/>`;
        if (s.style === "dashed") return Array.from({ length: 5 }, (_, i) =>
            `<rect x="27" y="${4 + i * 11}" width="6" height="6" fill="#f8f9fa"/>`).join("");
        if (s.style === "solidWhiteEdge") return `<rect x="46" y="4" width="5" height="52" fill="#f8f9fa"/>`;
        if (s.style === "diagonalStripes") return `<g stroke="#f8f9fa" stroke-width="4">
            <line x1="8" y1="52" x2="52" y2="8"/><line x1="18" y1="56" x2="56" y2="18"/><line x1="2" y1="42" x2="42" y2="2"/></g>`;
        return "";
      case "none":
      default:
        return "";
    }
  }

  function renderSignIcon(spec) {
    return `<svg viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg">${shapeMarkup(spec)}${innerMarkup(spec)}</svg>`;
  }

  let currentIndex = 0;

  const flashcard = document.getElementById("flashcard");
  const qNumFront = document.getElementById("qNumFront");
  const questionText = document.getElementById("questionText");
  const optionsList = document.getElementById("optionsList");
  const answerText = document.getElementById("answerText");
  const progress = document.getElementById("progress");
  const nextBtn = document.getElementById("nextBtn");
  const prevBtn = document.getElementById("prevBtn");
  const jumpInput = document.getElementById("jumpInput");
  const jumpBtn = document.getElementById("jumpBtn");
  const jumpError = document.getElementById("jumpError");

  function renderCard() {
    const item = questions[currentIndex];

    // Always show the question side first when navigating
    flashcard.classList.remove("flipped");

    qNumFront.textContent = item.number;
    questionText.textContent = item.question;

    const signIconWrap = document.getElementById("signIconWrap");
    const spec = SIGN_SPECS[item.number];
    signIconWrap.innerHTML = spec ? renderSignIcon(spec) : "";

    optionsList.innerHTML = "";
    Object.entries(item.options).forEach(([letter, text]) => {
      const li = document.createElement("li");
      li.textContent = `${letter}. ${text}`;
      optionsList.appendChild(li);
    });

    const correctLetter = item.answer;
    const correctText = item.options[correctLetter];
    answerText.innerHTML = `<div class="correct-answer">${correctLetter}. ${correctText}</div>`;

    progress.textContent = `Question ${item.number} of ${questions.length}`;
  }

  flashcard.addEventListener("click", () => {
    flashcard.classList.toggle("flipped");
  });

  nextBtn.addEventListener("click", () => {
    currentIndex = (currentIndex + 1) % questions.length;
    renderCard();
  });

  prevBtn.addEventListener("click", () => {
    currentIndex = (currentIndex - 1 + questions.length) % questions.length;
    renderCard();
  });

  function jumpToQuestion() {
    const value = parseInt(jumpInput.value, 10);

    if (isNaN(value) || value < 1 || value > questions.length) {
      jumpError.textContent = `Please enter a number between 1 and ${questions.length}.`;
      jumpError.style.display = "block";
      return;
    }

    jumpError.style.display = "none";
    currentIndex = value - 1; // question numbers start at 1, array is 0-indexed
    renderCard();
    jumpInput.value = "";
  }

  jumpBtn.addEventListener("click", jumpToQuestion);

  jumpInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") {
      jumpToQuestion();
    }
  });

  renderCard();
